name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/backend
            git pull
            docker run --rm -v "$(pwd)":/app -w /app maven:3.9.9-eclipse-temurin-21-alpine mvn clean package -DskipTests
            docker build -t wrenchlog-backend .
            docker stop backend
            docker rm backend
            docker run -d --name backend --restart=always \
              --memory=400m \
              -v wrenchlog_uploads:/app/wrenchlog-uploads-prod \
              -e JAVA_OPTS="-Xmx300m" \
              --env-file ~/backend/.env --network backend_default wrenchlog-backend